name: Repository Policy Guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  policy:
    name: Validate repository layout and explain violations
    runs-on: ubuntu-latest
    steps:
      - name: Check out source with PR base history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run repository governance policy unit and negative tests
        run: python3 -m unittest discover -s tests/policy -p 'test_*.py' -v
      - name: Live-verify official sources and declared technical claims
        if: github.event_name == 'pull_request'
        run: python3 scripts/verify_official_sources.py --json-out "$RUNNER_TEMP/source-audit.json"
      - name: Record live source validation in GitHub Actions summary
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/source-audit.json"; then
            echo '### Live official source verification (text assertions only)' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/source-audit.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Enforce source-first review for every changed PR file
        if: github.event_name == 'pull_request'
        env:
          SOURCE_GATE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check_source_first_changes.py --base-sha "$SOURCE_GATE_BASE_SHA"
      - name: Check tracked files and P0 governance contract
        run: python3 scripts/check_repository_policy.py
      - name: Generate read-only governance inventory and CI dashboard
        if: always()
        run: |
          python3 scripts/governance_inventory.py --json-out "$RUNNER_TEMP/governance-inventory.json" --markdown-out "$RUNNER_TEMP/governance-summary.md"
          cat "$RUNNER_TEMP/governance-summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Probe all ten GOV-P0 phase steps without false acceptance
        if: always()
        run: |
          python3 scripts/governance_phase0_probe.py --json-out "$RUNNER_TEMP/governance-phase0-ten-steps.json" --summary-out "$RUNNER_TEMP/governance-phase0-ten-steps.md"
          cat "$RUNNER_TEMP/governance-phase0-ten-steps.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Render read-only governance HTML dashboard and SVG progress chart
        if: always()
        run: |
          if test -s "$RUNNER_TEMP/governance-inventory.json" && test -s "$RUNNER_TEMP/governance-phase0-ten-steps.json"; then
            python3 scripts/render_governance_dashboard.py \
              --inventory "$RUNNER_TEMP/governance-inventory.json" \
              --probe "$RUNNER_TEMP/governance-phase0-ten-steps.json" \
              --output-dir "$RUNNER_TEMP/governance-dashboard"
            cat "$RUNNER_TEMP/governance-dashboard/dashboard.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### Dashboard BLOCKED: required evidence snapshots missing' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Verify actual prior CI evidence artifact and prove bounded reuse
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys, urllib.request
          repo = os.environ["REPOSITORY"]
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs?event=pull_request&status=success&per_page=100",
              headers={"Accept": "application/vnd.github+json",
                       "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                       "X-GitHub-Api-Version": "2022-11-28"})
          with urllib.request.urlopen(req, timeout=30) as response:
              runs = json.load(response)["workflow_runs"]
          matches = [r for r in runs if r["name"] == "Repository Policy Guard"
                     and r["id"] != int(os.environ["CURRENT_RUN"])
                     and r["head_repository"]["full_name"] == repo]
          if not matches:
              print("EVIDENCE_LIVE_REUSE: OPEN; no earlier trusted completed run")
              sys.exit(1)
          selected = matches[0]
          common = ["python3", "scripts/verify_governance_artifact.py",
                    "--repo", repo, "--run-id", str(selected["id"]),
                    "--expected-sha", selected["head_sha"],
                    "--cache-dir", os.environ["RUNNER_TEMP"] + "/evidence-readback-cache"]
          first = json.loads(subprocess.check_output(common, text=True))
          second = json.loads(subprocess.check_output(common, text=True))
          if not (first["status"] == second["status"] == "CHECK_OK"
                  and first["content_readback_verified"]
                  and not first["archive_reused"]
                  and second["archive_reused"]
                  and not second["ci_tests_reexecuted"]
                  and second["governance_acceptance"] == "OPEN"):
              sys.exit("LIVE_EVIDENCE_REUSE_PROOF_INVALID")
          with open(os.environ["RUNNER_TEMP"] + "/evidence-live-reuse.json", "w") as f:
              json.dump({"initial": first, "reuse": second}, f, indent=2)
          print("LIVE_EVIDENCE_READBACK_AND_REUSE: PASS; GOV-P0: OPEN")
          PY
      - name: Preserve governance inventory for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-inventory
          path: |
            ${{ runner.temp }}/source-audit.json
            ${{ runner.temp }}/evidence-live-reuse.json
            ${{ runner.temp }}/governance-inventory.json
            ${{ runner.temp }}/governance-summary.md
            ${{ runner.temp }}/governance-phase0-ten-steps.json
            ${{ runner.temp }}/governance-phase0-ten-steps.md
            ${{ runner.temp }}/governance-dashboard/
          if-no-files-found: warn
          retention-days: 30
