name: Repository Policy Guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  policy:
    name: Validate repository layout and explain violations
    runs-on: ubuntu-latest
    steps:
      - name: Check out source with PR base history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run repository governance policy unit and negative tests
        run: python3 -m unittest discover -s tests/policy -p 'test_*.py' -v
      - name: Live-verify official sources and declared technical claims
        if: github.event_name == 'pull_request'
        run: python3 scripts/verify_official_sources.py --json-out "$RUNNER_TEMP/source-audit.json"
      - name: Record live source validation in GitHub Actions summary
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/source-audit.json"; then
            echo '### Live official source verification (text assertions only)' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/source-audit.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Enforce source-first review for every changed PR file
        if: github.event_name == 'pull_request'
        env:
          SOURCE_GATE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check_source_first_changes.py --base-sha "$SOURCE_GATE_BASE_SHA"
      - name: Check tracked files and P0 governance contract
        run: python3 scripts/check_repository_policy.py
      - name: Generate read-only governance inventory and CI dashboard
        if: always()
        run: |
          python3 scripts/governance_inventory.py --json-out "$RUNNER_TEMP/governance-inventory.json" --markdown-out "$RUNNER_TEMP/governance-summary.md"
          cat "$RUNNER_TEMP/governance-summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Probe all ten GOV-P0 phase steps without false acceptance
        if: always()
        run: |
          python3 scripts/governance_phase0_probe.py --json-out "$RUNNER_TEMP/governance-phase0-ten-steps.json" --summary-out "$RUNNER_TEMP/governance-phase0-ten-steps.md"
          cat "$RUNNER_TEMP/governance-phase0-ten-steps.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Render read-only governance HTML dashboard and SVG progress chart
        if: always()
        run: |
          if test -s "$RUNNER_TEMP/governance-inventory.json" && test -s "$RUNNER_TEMP/governance-phase0-ten-steps.json"; then
            python3 scripts/render_governance_dashboard.py \
              --inventory "$RUNNER_TEMP/governance-inventory.json" \
              --probe "$RUNNER_TEMP/governance-phase0-ten-steps.json" \
              --output-dir "$RUNNER_TEMP/governance-dashboard"
            cat "$RUNNER_TEMP/governance-dashboard/dashboard.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### Dashboard BLOCKED: required evidence snapshots missing' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Preserve governance inventory for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-inventory
          path: |
            ${{ runner.temp }}/source-audit.json
            ${{ runner.temp }}/governance-inventory.json
            ${{ runner.temp }}/governance-summary.md
            ${{ runner.temp }}/governance-phase0-ten-steps.json
            ${{ runner.temp }}/governance-phase0-ten-steps.md
            ${{ runner.temp }}/governance-dashboard/
          if-no-files-found: warn
          retention-days: 30

      - name: Download this run's original evidence artifact
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: governance-inventory
          path: ${{ runner.temp }}/evidence-original-readback
      - name: Independently check downloaded evidence and repeat scoped readback
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          import io, json, os, subprocess, sys, zipfile
          from pathlib import Path
          from scripts.verify_governance_artifact import inspect_archive, sha
          root = Path(os.environ["RUNNER_TEMP"]) / "evidence-original-readback"
          required = ["governance-inventory.json", "governance-phase0-ten-steps.json"]
          if any(not (root / n).is_file() for n in required):
              sys.exit("EVIDENCE_EXTRACTED_REQUIRED_REPORT_MISSING")
          content = {name: (root / name).read_bytes() for name in required}
          binary = io.BytesIO()
          with zipfile.ZipFile(binary, "w", zipfile.ZIP_DEFLATED) as z:
              for name in required:
                  z.writestr(name, content[name])
          packed = binary.getvalue()
          meta = {"digest": "sha256:" + sha(packed)}
          revision = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          contract = Path("docs/architecture/GOVERNANCE-CONTRACT.json").read_bytes()
          baseline = Path("docs/architecture/BASELINE.md").read_bytes()
          first = inspect_archive(packed, meta, revision, contract, baseline)
          second = inspect_archive(packed, meta, revision, contract, baseline)
          if not (first["status"] == second["status"] == "CHECK_OK"
                  and first["content_readback_verified"]
                  and first["governance_acceptance"] == "OPEN"
                  and second["code_sha"] == revision):
              print(json.dumps({"first": first, "second": second}))
              sys.exit("CI_EVIDENCE_READBACK_INVALID")
          # Alter only the claim, preserve the original artifact. This must be rejected.
          altered = json.loads(content["governance-inventory.json"])
          altered["capabilities"][0]["verified"] = True
          tampered = io.BytesIO()
          with zipfile.ZipFile(tampered, "w", zipfile.ZIP_DEFLATED) as z:
              z.writestr("governance-inventory.json", json.dumps(altered))
              z.writestr("governance-phase0-ten-steps.json", content["governance-phase0-ten-steps.json"])
          negative = inspect_archive(tampered.getvalue(),
                                     {"digest": "sha256:" + sha(tampered.getvalue())},
                                     revision, contract, baseline)
          if negative.get("code") != "FALSE_ACCEPTANCE_OR_COVERAGE":
              sys.exit("FALSE_ACCEPTANCE_NEGATIVE_NOT_REJECTED")
          evidence = {"readback": first, "repeat_readback": second,
                      "original_zip_digest_checked_by_this_python_step": False,
                      "repacked_report_zip_sha256": sha(packed),
                      "artifact_integrity_provider": "actions/download-artifact@v4",
                      "original_artifact_sha256_not_equal_repacked_sha256": True,
                      "negative": negative, "downloaded_with": "actions/download-artifact@v4",
                      "scope": "same-run artifact content; no independent approval of GOV-P0",
                      "tests_reexecuted_by_repeat": False}
          (Path(os.environ["RUNNER_TEMP"]) / "evidence-readback.json").write_text(
              json.dumps(evidence, indent=2), encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\\n### Original artifact readback (same run)\\n")
              summary.write("- Content readback: **PASS**; false PASS negative test: **PASS**.\\n")
              summary.write("- Repeated scoped evaluation: **PASS** without re-running tests.\\n")
              summary.write("- Original archive digest: verified by the official download action, not this Python step.\\n")
              summary.write("- Durable cross-run evidence reuse: **NOT YET PROVEN**; GOV-P0: **OPEN**.\\n")
          print("SAME_RUN_ARTIFACT_CONTENT_READBACK: PASS; SCOPED_REUSE: PASS; GOV-P0: OPEN")
          PY
      - name: Preserve independent artifact readback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-evidence-readback
          path: ${{ runner.temp }}/evidence-readback.json
          if-no-files-found: warn
          retention-days: 30
