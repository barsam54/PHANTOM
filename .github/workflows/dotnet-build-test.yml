name: PHANTOM .NET Build and Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout with source-first base history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Source-first admission before restore, build, tests or model use
        if: github.event_name == 'pull_request'
        env:
          SOURCE_GATE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check_source_first_changes.py --base-sha "$SOURCE_GATE_BASE_SHA"
      - name: Live-verify official sources and declared technical claims
        if: github.event_name == 'pull_request'
        run: python3 scripts/verify_official_sources.py --json-out "$RUNNER_TEMP/source-audit.json"
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.115'
      - name: Restore infrastructure test project and referenced source
        run: dotnet restore tests/Phantom.Infrastructure.Tests/Phantom.Infrastructure.Tests.csproj
      - name: Build infrastructure test project and referenced source
        run: dotnet build tests/Phantom.Infrastructure.Tests/Phantom.Infrastructure.Tests.csproj --configuration Release --no-restore
      - name: Build local proposal CLI without invoking Ollama
        run: dotnet build src/Phantom.LocalGovernanceCli/Phantom.LocalGovernanceCli.csproj --configuration Release
      - name: Validate local proposal CLI profile without inference
        run: dotnet run --project src/Phantom.LocalGovernanceCli/Phantom.LocalGovernanceCli.csproj --configuration Release --no-build -- --check-profile
      - name: Exercise offline proposal-to-governance workflow handoff
        run: |
          dotnet run --project src/Phantom.LocalGovernanceCli/Phantom.LocalGovernanceCli.csproj --configuration Release --no-build -- --probe-workflow > "$RUNNER_TEMP/gov-proposal-handoff.json"
          python3 - "$RUNNER_TEMP/gov-proposal-handoff.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          steps = report["Steps"]
          assert report["Acceptance"] == "OPEN"
          assert len(steps) == 10
          assert steps[4]["Status"] == "REVIEW_REQUIRED"
          assert steps[4]["Code"] == "GOV_UNTRUSTED_PROPOSAL_RECORDED"
          assert steps[7]["Status"] == "BLOCKED"
          assert report["Proposal"]["Origin"] == "test:synthetic-no-inference"
          assert len(report["Proposal"]["Sha256"]) == 64
          print("OFFLINE_HANDOFF_CHECK_OK; MODEL_INFERENCE_NOT_TESTED; GOV_P0_OPEN")
          PY
      - name: Preserve offline handoff decision report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-proposal-handoff
          path: ${{ runner.temp }}/gov-proposal-handoff.json
          if-no-files-found: warn
          retention-days: 30
      - name: Verify process-separated Microsoft checkpoint capture and resume
        run: |
          checkpoint_dir="$RUNNER_TEMP/gov-checkpoints-restart"
          dotnet run --project src/Phantom.LocalGovernanceCli/Phantom.LocalGovernanceCli.csproj --configuration Release --no-build -- --checkpoint-capture "$checkpoint_dir"
          dotnet run --project src/Phantom.LocalGovernanceCli/Phantom.LocalGovernanceCli.csproj --configuration Release --no-build -- --checkpoint-resume "$checkpoint_dir"
      - name: Run MSTest using Microsoft.Testing.Platform
        id: dotnet_tests
        run: |
          dotnet test --project tests/Phantom.Infrastructure.Tests/Phantom.Infrastructure.Tests.csproj --configuration Release --no-restore 2>&1 | tee "$RUNNER_TEMP/dotnet-tests.log"
      - name: Create deterministic scoped .NET CI evidence receipt
        if: always()
        env:
          DOTNET_TEST_OUTCOME: ${{ steps.dotnet_tests.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(".")
          target = pathlib.Path(os.environ["RUNNER_TEMP"])
          log = target / "dotnet-tests.log"
          receipt = {
              "schema_version": "phantom.governance.dotnet-receipt.v1",
              "criterion_id": "governance.dotnet_ci",
              "checkout_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "contract_sha256": hashlib.sha256((root / "docs/architecture/GOVERNANCE-CONTRACT.json").read_bytes()).hexdigest(),
              "baseline_sha256": hashlib.sha256((root / "docs/architecture/BASELINE.md").read_bytes()).hexdigest(),
              "test_project": "tests/Phantom.Infrastructure.Tests/Phantom.Infrastructure.Tests.csproj",
              "test_runner": "Microsoft.Testing.Platform",
              "test_step_outcome": os.environ["DOTNET_TEST_OUTCOME"],
              "job_status_at_receipt": os.environ["JOB_STATUS"],
              "test_log_sha256": hashlib.sha256(log.read_bytes()).hexdigest() if log.exists() else None,
              "test_log_bytes": log.stat().st_size if log.exists() else 0,
              "acceptance": "OPEN"
          }
          (target / "dotnet-ci-receipt.json").write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print("DOTNET_EVIDENCE_RECEIPT: CREATED; outcome=" + receipt["test_step_outcome"])
          PY
      - name: Preserve .NET test output and provenance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-dotnet-test-evidence
          path: |
            ${{ runner.temp }}/dotnet-ci-receipt.json
            ${{ runner.temp }}/dotnet-tests.log
          if-no-files-found: error
          retention-days: 30
